# Cards of the OVS VM. Each card is renamed after its segment, by MAC address (.link file).
# vlan: the access VLAN of the port. No vlan = trunk port (carries every VLAN, towards pfSense).
ovs_cards:
  - { link: seg-trunk,  mac: "02:50:00:00:01:01" }
  - { link: seg-admin,  mac: "02:50:00:00:01:10", vlan: 10 }
  - { link: seg-dc,     mac: "02:50:00:00:01:20", vlan: 20 }
  - { link: seg-fs,     mac: "02:50:00:00:01:21", vlan: 20 }
  - { link: seg-siem,   mac: "02:50:00:00:01:22", vlan: 20 }
  - { link: seg-cli,    mac: "02:50:00:00:01:30", vlan: 30 }
  - { link: seg-backup, mac: "02:50:00:00:01:40", vlan: 40 }

# Management port: an internal port of the bridge, reachable from ADMIN01 on VLAN 10
ovs_mgmt:
  address: "{{ ips.ovs }}/24"
  vlan: "{{ zones.admin.vlan }}"
  gateway: "{{ zones.admin.gateway }}" # pfSense, towards the other zones
