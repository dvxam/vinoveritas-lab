# Machines of the lab. On the server itself (hostname pve): direct, the VMs are on its own networks.
# From the Mac: through the server (ProxyJump), over the WireGuard tunnel.
# accept-new: VMs are often rebuilt, their new host key is recorded on first contact.
all:
  vars:
    ansible_user: root
    ansible_ssh_common_args: >-
      -o StrictHostKeyChecking=accept-new
      {{ '' if lookup('ansible.builtin.pipe', 'hostname -s') == 'pve' else '-o ProxyJump=debian@10.99.0.1' }}
  hosts:
    # The OVH server itself, directly through the tunnel
    pve:
      ansible_host: 10.99.0.1
      ansible_user: debian
      ansible_ssh_common_args: ""
      ansible_connection: "{{ 'local' if lookup('ansible.builtin.pipe', 'hostname -s') == 'pve' else 'ssh' }}"
    admin01:
      # Fixed address on the temporary nat link (2-lab/admin01.tf)
      ansible_host: 192.168.206.10
    ovs:
      # DHCP address on the temporary nat network: check it with `tofu -chdir=2-lab output ssh`
      ansible_host: 192.168.206.166
    siem01:
      # Fixed address on the temporary nat link (2-lab/siem01.tf)
      ansible_host: 192.168.206.30
    dc01:
      ansible_host: 10.50.20.10
    fs01:
      ansible_host: 10.50.20.20
    client01:
      # Fixed DHCP lease on pfSense (host_vars/pfsense.yml); WinRM through the temporary rule F21
      ansible_host: 10.50.30.10
    pfsense:
      # LAN on VLAN 10, only reachable through ADMIN01 (Mission 2: pfSense is administered from ADMIN)
      ansible_host: 10.50.10.1
      ansible_user: admin
      ansible_python_interpreter: /usr/local/bin/python3.11
      ansible_ssh_common_args: >-
        -o StrictHostKeyChecking=accept-new
        -o ProxyJump={{ '' if lookup('ansible.builtin.pipe', 'hostname -s') == 'pve' else 'debian@10.99.0.1,' }}root@192.168.206.10

# Windows VMs: WinRM over HTTPS (flow F11), from ADMIN01 only (route through pfSense).
# Run there: ssh into ADMIN01, then ansible-playbook dc01.yml (see NOTES.md).
windows:
  hosts:
    dc01:
    fs01:
    client01:
  vars:
    ansible_connection: winrm
    ansible_port: 5986
    ansible_winrm_transport: ntlm
    ansible_user: Administrator
    ansible_password: "{{ windows_admin_password }}" # ansible/secrets/windows.yml, not versioned
    # Self-signed certificate made at install (setup-winrm.ps1). To do: trust it on ADMIN01
    # (ansible_winrm_ca_trust_path) instead of skipping the check, and say so in the report.
    ansible_winrm_server_cert_validation: ignore
