# Machines of the lab, reached through the server (ProxyJump), over the WireGuard tunnel.
all:
  vars:
    ansible_user: root
    ansible_ssh_common_args: "-o ProxyJump=debian@10.99.0.1"
  hosts:
    admin01:
      # Fixed address on the temporary nat link (2-lab/vms.tf)
      ansible_host: 192.168.206.10
    ovs:
      # DHCP address on the temporary nat network: check it with `tofu -chdir=2-lab output ssh`
      ansible_host: 192.168.206.165
