---
# Common to the Windows servers: remote administration from the ADMIN zone only (F11).
# WinRM over HTTPS is already set up at install (2-lab/modules/windows_vm/templates/setup-winrm.ps1.tftpl).

# AD, GPO and file server consoles are used over RDP from ADMIN01
- name: Allow Remote Desktop
  ansible.windows.win_regedit:
    path: HKLM:\System\CurrentControlSet\Control\Terminal Server
    name: fDenyTSConnections
    data: 0
    type: dword

- name: Open RDP to the ADMIN zone only
  community.windows.win_firewall_rule:
    name: Remote Desktop (ADMIN zone, F11)
    localport: 3389
    protocol: tcp
    direction: in
    action: allow
    remoteip: "{{ windows_admin_network }}"
    state: present
    enabled: true
