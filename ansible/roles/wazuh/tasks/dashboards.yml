---
# Dashboards of Vino Veritas in the Wazuh dashboard (Mission 7), imported through its API.
# templates/access-dashboard.ndjson.j2: "Accès et identités" (failed logons, privileged accounts,
# AD changes). It was generated by a script; after editing it in the web interface, export it
# again (Dashboards Management > Saved objects > Export) and put back the variable
# wazuh_alerts_pattern_id in place of the index pattern id.

- name: Get the dashboard admin password
  ansible.builtin.include_tasks: dashboard_password.yml

# The Wazuh application creates this index pattern at the first login in the web interface
- name: Find the index pattern of the alerts
  ansible.builtin.uri:
    url: https://127.0.0.1/api/saved_objects/_find?type=index-pattern&per_page=100
    url_username: admin
    url_password: "{{ wazuh_api_password }}"
    force_basic_auth: true
    validate_certs: false # self-signed certificate made by the assistant
  register: wazuh_patterns

- name: Remember its id
  ansible.builtin.set_fact:
    wazuh_alerts_pattern_id: "{{ (wazuh_patterns.json.saved_objects | selectattr('attributes.title', 'equalto', 'wazuh-alerts-*') | first).id }}"
  when: wazuh_patterns.json.saved_objects | selectattr('attributes.title', 'equalto', 'wazuh-alerts-*') | list | length > 0

- name: The index pattern of the alerts exists
  ansible.builtin.assert:
    that: wazuh_alerts_pattern_id is defined
    fail_msg: "Modèle d'index wazuh-alerts-* absent : se connecter une fois au tableau de bord Wazuh, puis relancer"
    quiet: true

- name: Create the directory of the dashboard files
  ansible.builtin.file:
    path: "{{ wazuh_install_dir }}/dashboards"
    state: directory
    mode: "0700"

- name: Write the dashboard file
  ansible.builtin.template:
    src: access-dashboard.ndjson.j2
    dest: "{{ wazuh_install_dir }}/dashboards/access-dashboard.ndjson"
    mode: "0600"
  register: wazuh_dashboard_file

# A first import that failed left the file in place: checking the file alone would skip the import forever
- name: Check whether the dashboard exists
  ansible.builtin.uri:
    url: https://127.0.0.1/api/saved_objects/dashboard/vv-access-identities
    url_username: admin
    url_password: "{{ wazuh_api_password }}"
    force_basic_auth: true
    validate_certs: false
  register: wazuh_dashboard_present
  failed_when: false

# Imported when the file changes or the dashboard is missing (overwrite: the version of the repository wins).
# To restore a dashboard changed in the web interface: -e wazuh_dashboards_force=true
- name: Import the dashboard
  ansible.builtin.uri:
    url: https://127.0.0.1/api/saved_objects/_import?overwrite=true
    method: POST
    url_username: admin
    url_password: "{{ wazuh_api_password }}"
    force_basic_auth: true
    validate_certs: false
    headers:
      osd-xsrf: "true"
    body_format: form-multipart
    body:
      file:
        filename: "{{ wazuh_install_dir }}/dashboards/access-dashboard.ndjson"
        mime_type: application/x-ndjson
  register: wazuh_import
  changed_when: true
  failed_when: wazuh_import.status != 200 or not wazuh_import.json.success | default(false)
  when: >-
    wazuh_dashboard_file.changed
    or wazuh_dashboard_present.status != 200
    or wazuh_dashboards_force | default(false) | bool
