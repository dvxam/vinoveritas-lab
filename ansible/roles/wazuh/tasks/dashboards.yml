---
# Dashboards of Vino Veritas in the Wazuh dashboard (Mission 7), imported through its API.
# One template per dashboard (list wazuh_dashboards in defaults/main.yml), generated by a script.
# After editing a dashboard in the web interface, export it again (Dashboards Management >
# Saved objects > Export) and put back the variable wazuh_alerts_pattern_id in place of the
# index pattern id.

- name: Get the dashboard admin password
  ansible.builtin.include_tasks: dashboard_password.yml

# The Wazuh application creates this index pattern at the first login in the web interface
- name: Find the index pattern of the alerts
  ansible.builtin.uri:
    url: https://127.0.0.1/api/saved_objects/_find?type=index-pattern&per_page=100
    url_username: admin
    url_password: "{{ wazuh_api_password }}"
    force_basic_auth: true
    validate_certs: false # self-signed certificate made by the assistant
  register: wazuh_patterns

# Title -> id of every index pattern; the templates use wazuh_pattern_ids['<title>']
# (and wazuh_alerts_pattern_id, kept for the older templates)
- name: Remember their ids
  ansible.builtin.set_fact:
    wazuh_pattern_ids: "{{ dict(wazuh_patterns.json.saved_objects | map(attribute='attributes.title') | zip(wazuh_patterns.json.saved_objects | map(attribute='id'))) }}"

- name: The index patterns used by the dashboards exist
  ansible.builtin.assert:
    that: item in wazuh_pattern_ids
    fail_msg: "Modèle d'index {{ item }} absent : se connecter une fois au tableau de bord Wazuh, puis relancer"
    quiet: true
  loop: "{{ wazuh_dashboards | map(attribute='pattern') | unique }}"

- name: Remember the id of the alerts pattern
  ansible.builtin.set_fact:
    wazuh_alerts_pattern_id: "{{ wazuh_pattern_ids['wazuh-alerts-*'] }}"

- name: Create the directory of the dashboard files
  ansible.builtin.file:
    path: "{{ wazuh_install_dir }}/dashboards"
    state: directory
    mode: "0700"

- name: Write the dashboard files
  ansible.builtin.template:
    src: "{{ item.file }}.j2"
    dest: "{{ wazuh_install_dir }}/dashboards/{{ item.file }}"
    mode: "0600"
  loop: "{{ wazuh_dashboards }}"
  loop_control:
    label: "{{ item.file }}"
  register: wazuh_dashboard_files

# A first import that failed left the file in place: checking the file alone would skip the import forever
- name: Check whether each dashboard exists
  ansible.builtin.uri:
    url: "https://127.0.0.1/api/saved_objects/dashboard/{{ item.id }}"
    url_username: admin
    url_password: "{{ wazuh_api_password }}"
    force_basic_auth: true
    validate_certs: false
  loop: "{{ wazuh_dashboards }}"
  loop_control:
    label: "{{ item.id }}"
  register: wazuh_dashboards_present
  failed_when: false

# Imported when its file changes or it is missing (overwrite: the version of the repository wins).
# To restore a dashboard changed in the web interface: -e wazuh_dashboards_force=true
- name: Import each dashboard
  ansible.builtin.uri:
    url: https://127.0.0.1/api/saved_objects/_import?overwrite=true
    method: POST
    url_username: admin
    url_password: "{{ wazuh_api_password }}"
    force_basic_auth: true
    validate_certs: false
    headers:
      osd-xsrf: "true"
    body_format: form-multipart
    remote_src: true # the file is on SIEM01, not on the machine that runs Ansible
    body:
      file:
        filename: "{{ wazuh_install_dir }}/dashboards/{{ item.0.file }}"
        mime_type: application/x-ndjson
  loop: "{{ wazuh_dashboards | zip(wazuh_dashboard_files.results, wazuh_dashboards_present.results) | list }}"
  loop_control:
    label: "{{ item.0.id }}"
  register: wazuh_import
  changed_when: true
  failed_when: wazuh_import.status != 200 or not wazuh_import.json.success | default(false)
  when: >-
    item.1.changed
    or item.2.status != 200
    or wazuh_dashboards_force | default(false) | bool
