---
# Checks on the running Wazuh: services, listening ports, dashboard answering.
# Read-only: changes nothing on the machine.

- name: Read the state of the services
  ansible.builtin.service_facts:

- name: Every Wazuh service is running
  ansible.builtin.assert:
    that: ansible_facts.services[item ~ '.service'].state | default('absent') == 'running'
    fail_msg: "{{ item }} : {{ ansible_facts.services[item ~ '.service'].state | default('absent') }}"
    success_msg: "{{ item }} tourne"
  loop: "{{ wazuh_services }}"

# The indexer can take a minute to open its port after a reboot
- name: Every Wazuh port is listening
  ansible.builtin.wait_for:
    port: "{{ item.port }}"
    timeout: 120
  loop: "{{ wazuh_ports }}"
  loop_control:
    label: "{{ item.port }} ({{ item.what }})"

# Self-signed certificate made by the assistant: not checked here, the test is "the dashboard answers"
- name: Ask the dashboard for its login page
  ansible.builtin.uri:
    url: https://127.0.0.1/app/login
    validate_certs: false
    status_code: [200, 302]
  register: wazuh_dashboard
  retries: 10
  delay: 15
  until: wazuh_dashboard is succeeded

- name: The dashboard answers
  ansible.builtin.assert:
    that: wazuh_dashboard.status in [200, 302]
    success_msg: "Tableau de bord Wazuh joignable (HTTP {{ wazuh_dashboard.status }})"

# UDP: wait_for cannot test it, read the listening sockets instead
- name: Read the UDP sockets
  ansible.builtin.command: ss -lun
  register: wazuh_udp
  changed_when: false

- name: The manager receives syslog (F26)
  ansible.builtin.assert:
    that: "(':' ~ wazuh_syslog_port ~ ' ') in wazuh_udp.stdout"
    fail_msg: "Rien n'écoute sur {{ wazuh_syslog_port }}/udp"
    success_msg: "Syslog reçu sur {{ wazuh_syslog_port }}/udp"

- name: Read the route to the other zones
  ansible.builtin.command: ip route show {{ lab_network }}
  register: wazuh_route
  changed_when: false

- name: The other zones are reached through pfSense
  ansible.builtin.assert:
    that: ("via " ~ wazuh_zones_gateway) in wazuh_route.stdout
    fail_msg: "Pas de route vers {{ lab_network }} par {{ wazuh_zones_gateway }} : {{ wazuh_route.stdout }}"
    success_msg: "Zones jointes par pfSense ({{ wazuh_route.stdout }})"

- name: Get the dashboard admin password
  ansible.builtin.include_tasks: dashboard_password.yml

- name: Ask for each dashboard
  ansible.builtin.uri:
    url: "https://127.0.0.1/api/saved_objects/dashboard/{{ item.id }}"
    url_username: admin
    url_password: "{{ wazuh_api_password }}"
    force_basic_auth: true
    validate_certs: false
  loop: "{{ wazuh_dashboards }}"
  loop_control:
    label: "{{ item.id }}"
  register: wazuh_dashboards_check
  failed_when: false

- name: Each dashboard exists
  ansible.builtin.assert:
    that: item.status == 200
    fail_msg: "Tableau de bord {{ item.item.id }} absent (HTTP {{ item.status }})"
    # Fixed text: Ansible evaluates success_msg even when the dashboard is missing (404, no attributes)
    success_msg: "Tableau de bord {{ item.item.id }} présent"
  loop: "{{ wazuh_dashboards_check.results }}"
  loop_control:
    label: "{{ item.item.id }}"

# A real line sent by pfSense (no hostname), through the rules of the manager.
# wazuh-logtest prints its result on stderr: merged into stdout for the assert below.
- name: Test a pfSense block with wazuh-logtest
  ansible.builtin.shell: >-
    echo 'Nov  1 19:39:58 filterlog[78906]: 4,,,1000000103,em1.20,match,block,in,4,0x0,,128,62702,0,none,17,udp,229,10.50.20.10,10.50.20.255,138,138,209'
    | /var/ossec/bin/wazuh-logtest 2>&1
  register: wazuh_pfsense_test
  changed_when: false

- name: A pfSense block becomes an alert, with source and destination
  ansible.builtin.assert:
    that:
      - "\"id: '100201'\" in wazuh_pfsense_test.stdout"
      - "\"srcip: '10.50.20.10'\" in wazuh_pfsense_test.stdout"
      - "\"dstport: '138'\" in wazuh_pfsense_test.stdout"
    fail_msg: "Blocage pfSense mal décodé : {{ wazuh_pfsense_test.stdout_lines[-25:] }}"
    success_msg: "Blocage pfSense décodé (règle 100201, source, destination, port)"
