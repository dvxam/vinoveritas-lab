---
# Password of the dashboard admin account, read where the assistant left it (never in the repository).
# If it was changed afterwards (wazuh-passwords-tool.sh), pass it: -e wazuh_dashboard_password=...
- name: Read the dashboard admin password
  ansible.builtin.shell: >-
    tar -O -xf {{ wazuh_install_dir }}/wazuh-install-files.tar wazuh-install-files/wazuh-passwords.txt
    | grep -A1 "indexer_username: 'admin'"
    | sed -n "s/.*indexer_password: '\(.*\)'/\1/p"
  register: wazuh_password_file
  changed_when: false
  no_log: true
  when: wazuh_dashboard_password is not defined

- name: Remember the password
  ansible.builtin.set_fact:
    wazuh_api_password: "{{ wazuh_dashboard_password | default(wazuh_password_file.stdout) }}"
  no_log: true
