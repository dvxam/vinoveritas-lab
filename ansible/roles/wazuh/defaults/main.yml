---
# Wazuh release line: the installation assistant installs the latest patch of it
wazuh_version: "4.14"

# Where the assistant runs and leaves wazuh-install-files.tar (certificates and passwords)
wazuh_install_dir: /root

# Debian 13 is not in Wazuh's list of recommended systems: without -i (--ignore-check)
# the assistant stops before installing. Set to false once Debian 13 is listed.
wazuh_ignore_check: true

# Services of the all-in-one install
wazuh_services:
  - wazuh-indexer
  - wazuh-manager
  - wazuh-dashboard

# Ports checked by verify.yml, all on 0.0.0.0 by default
wazuh_ports:
  - { port: 443, what: "dashboard (HTTPS)" }
  - { port: 1514, what: "agents, events" }
  - { port: 1515, what: "agents, registration" }
  - { port: 9200, what: "indexer" }
  - { port: 55000, what: "manager API" }

# pfSense on VLAN 20: route to the other zones, for the agents of ADMIN01, OVS, CLIENT01, BACKUP01
wazuh_zones_gateway: "{{ zones.serveurs.gateway }}"

# Remote syslog received by the manager (flow F26): pfSense sends its firewall, system and
# authentication logs. Only these addresses are accepted: pfSense on the SERVEURS zone.
wazuh_syslog_port: 514
wazuh_syslog_allowed_ips:
  - "{{ zones.serveurs.gateway }}"

# Dashboards imported into the Wazuh dashboard (templates/<file>.j2, id of the dashboard object,
# index pattern its panels read)
wazuh_dashboards:
  - { file: access-dashboard.ndjson, id: vv-access-identities, pattern: wazuh-alerts-* }  # failed logons, privileged accounts, AD changes
  - { file: network-dashboard.ndjson, id: vv-network, pattern: wazuh-alerts-* }  # flows blocked by pfSense
  - { file: vulnerabilities-dashboard.ndjson, id: vv-vulnerabilities, pattern: wazuh-states-vulnerabilities-* }  # map by service, detail by machine
