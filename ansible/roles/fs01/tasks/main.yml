---
# FS01: member of vinoveritas.local, file server role.
# The shares (one per department, in C:\Partages) are created by the role file_shares.

- name: Use DC01 as DNS server
  ansible.windows.win_dns_client:
    adapter_names: "*"
    dns_servers: ["{{ fs01_dc }}"]

- name: Join the domain
  microsoft.ad.membership:
    dns_domain_name: "{{ fs01_domain }}"
    hostname: FS01
    domain_admin_user: "Administrator@{{ fs01_domain }}"
    domain_admin_password: "{{ windows_admin_password }}"
    state: domain
    reboot: true

- name: Install the file server role and its tools
  ansible.windows.win_feature:
    name: [FS-FileServer, FS-Resource-Manager]
    include_management_tools: true
