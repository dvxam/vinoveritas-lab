---
# Domain of the report (Context): vinoveritas.local
dc01_domain: vinoveritas.local
dc01_netbios: VINOVERITAS
# pfSense in VLAN 20: DNS forwarder and time source of the domain (F9)
dc01_upstream: "{{ zones.serveurs.gateway }}"

# Machines outside the domain: they do not register in DNS themselves, so fixed A records.
# Their address in the zones (Mission 2, IP plan), never the temporary nat link.
dc01_dns_records:
  - { name: pfsense, ip: "{{ ips.pfsense }}" } # ADMIN interface (web interface, SSH: F13)
  - { name: ovs, ip: "{{ ips.ovs }}" } # management port mgmt (F14)
  - { name: admin01, ip: "{{ ips.admin01 }}" }
  - { name: siem01, ip: "{{ ips.siem01 }}" } # Wazuh console and SSH from ADMIN01 (F25)
