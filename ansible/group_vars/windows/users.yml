---
# Accounts of the domain (Mission 4). Fictitious people, 2 or 3 per department.
# login: sAMAccountName, prenom.nom without accents, 20 characters at most (adm- included).
# admin: true = also gets a separate adm-<login> account, member of Domain Admins (measure 7, R5).
# Keep it identical to the draft "Mission 4 - Brouillon", section "Comptes".

users_ou: Utilisateurs     # one sub-OU per department under it
users_admin_ou: Administrateurs
users_upn_suffix: vinoveritas.local

# Initial passwords: random, made on the machine that runs Ansible (ADMIN01), outside the
# repository so that the rsync from the Mac does not delete them. Changed at first logon.
users_password_dir: "{{ lookup('ansible.builtin.env', 'HOME') }}/.vinoveritas/ad-passwords"

