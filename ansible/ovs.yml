# Configures the OVS VM. Run from the Mac over the tunnel, or later from ADMIN01:
#   ansible-playbook ovs.yml
- name: Configure Open vSwitch
  hosts: ovs
  roles:
    - ovs

# Checks the result. Second play, so the handlers (reboot, networkd) have already run.
- name: Check Open vSwitch
  hosts: ovs
  tags: verify # ansible-playbook <playbook> --tags verify: the checks only
  tasks:
    - name: Run the checks of the ovs role
      ansible.builtin.import_role:
        name: ovs
        tasks_from: verify
